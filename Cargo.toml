[package]
name = "minipy"
version = "0.1.0"
edition = "2024"
description = "A Python-subset interpreter written in Rust, from scratch, with zero dependencies"
license = "MIT"
repository = "https://github.com/vincent-mayer/minipy"
readme = "README.md"
keywords = ["python", "interpreter", "language", "repl"]
categories = ["command-line-utilities"]

[lib]
name = "minipy"
path = "src/lib.rs"

[[bin]]
name = "minipy"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
